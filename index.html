<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="E-book Orientador Social, Território e Transformação, de Carlos André Tavares de Lima." />
  <meta name="author" content="Carlos André Tavares de Lima" />
  <meta name="theme-color" content="#0f766e" />
  <title>Orientador Social, Território e Transformação</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: Arial, Helvetica, sans-serif; background: #f3f6f5; color: #17322e; }
    body { display: flex; flex-direction: column; }
    header {
      padding: 16px 20px;
      background: linear-gradient(135deg, #0f766e, #14532d);
      color: #fff;
      box-shadow: 0 2px 10px rgba(0,0,0,.18);
    }
    .wrap { width: min(1200px, 100%); margin: 0 auto; }
    h1 { margin: 0; font-size: clamp(1.2rem, 2.6vw, 2rem); line-height: 1.15; }
    .subtitle { margin: 6px 0 0; opacity: .92; font-size: .98rem; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 10px 14px; border-radius: 8px; text-decoration: none; font-weight: 700;
      border: 1px solid rgba(255,255,255,.45); transition: .2s ease;
    }
    .btn.primary { background: #fff; color: #0f766e; }
    .btn.secondary { background: rgba(255,255,255,.10); color: #fff; }
    .btn:hover { transform: translateY(-1px); filter: brightness(.98); }
    main { flex: 1; width: min(1200px, 100%); margin: 0 auto; padding: 16px; }
    .viewer {
      background: #fff; border-radius: 12px; overflow: hidden;
      box-shadow: 0 8px 28px rgba(15, 23, 42, .14);
      border: 1px solid #d9e4e1;
      height: calc(100vh - 165px);
      min-height: 620px;
    }
    iframe { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
    .fallback { padding: 24px; }
    footer { text-align: center; padding: 12px 16px 18px; font-size: .85rem; color: #49635f; }
    @media (max-width: 700px) {
      header { padding: 14px; }
      main { padding: 10px; }
      .viewer { height: calc(100vh - 205px); min-height: 520px; border-radius: 8px; }
      .btn { flex: 1; min-width: 140px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>Orientador Social, Território e Transformação</h1>
      <p class="subtitle">E-book de Carlos André Tavares de Lima • 1ª edição digital • Beberibe-CE • 2026</p>
      <div class="actions">
        <a class="btn primary" href="./EBOOK-Orientador-Social-Territorio-e-Transformacao-2026.pdf" target="_blank" rel="noopener">Abrir PDF</a>
        <a class="btn secondary" href="./EBOOK-Orientador-Social-Territorio-e-Transformacao-2026.pdf" download>Baixar e-book</a>
      </div>
    </div>
  </header>

  <main>
    <div class="viewer">
      <iframe
        src="./EBOOK-Orientador-Social-Territorio-e-Transformacao-2026.pdf#view=FitH"
        title="E-book Orientador Social, Território e Transformação">
        <div class="fallback">
          Seu navegador não conseguiu exibir o PDF. 
          <a href="./EBOOK-Orientador-Social-Territorio-e-Transformacao-2026.pdf">Clique aqui para abrir o e-book.</a>
        </div>
      </iframe>
    </div>
  </main>

  <footer>
    © 2026 Carlos André Tavares de Lima. Todos os direitos reservados.
  </footer>
</body>
</html>
